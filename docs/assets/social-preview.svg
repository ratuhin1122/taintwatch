<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Taintwatch: taint-tracking guardrails for Claude Code</title>
  <desc id="desc">Original 1280 by 640 social preview. Untrusted sources mark session taint; selected risky actions require approval. Decisions are recorded in a local audit log. Defense in depth, alongside permissions and sandboxing.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#70c8db"/></marker>
  </defs>
  <rect width="1280" height="640" fill="#102238"/>
  <rect x="0" y="0" width="12" height="640" fill="#70c8db"/>
  <g transform="translate(64 56) scale(.5)">
    <path d="M80 24 126 42v36c0 27-19 46-46 59-27-13-46-32-46-59V42Z" fill="none" stroke="#70c8db" stroke-width="7"/>
    <path d="M47 72h26l13 21h28" fill="none" stroke="#70c8db" stroke-width="7"/>
    <circle cx="48" cy="72" r="10" fill="#efb85b"/>
    <path d="M81 56v19m0 8v3" stroke="#efb85b" stroke-width="6"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="160" y="120" font-size="68" font-weight="700" fill="#f0f6fc">Taintwatch</text>
    <text x="1216" y="92" text-anchor="end" font-size="18" fill="#acc3d5">ratuhin1122/taintwatch</text>
    <text x="64" y="194" font-size="36" fill="#f0f6fc">Taint-tracking guardrails for Claude Code</text>
    <text x="64" y="242" font-size="23" fill="#acc3d5">Track untrusted content. Ask before selected risky actions.</text>
    <g fill="#18334e" stroke="#39566e" stroke-width="2">
      <rect x="64" y="292" width="320" height="160" rx="16"/>
      <rect x="480" y="292" width="320" height="160" rx="16"/>
      <rect x="896" y="292" width="320" height="160" rx="16"/>
    </g>
    <path d="M400 372H460M816 372H876" fill="none" stroke="#70c8db" stroke-width="3" marker-end="url(#arrow)"/>
    <g font-size="26" font-weight="700" fill="#efb85b">
      <text x="88" y="337">Untrusted source</text>
      <text x="504" y="337">Session taint</text>
      <text x="920" y="337">Approval gate</text>
    </g>
    <g font-size="20" fill="#f0f6fc">
      <text x="88" y="382">Web, MCP, and</text><text x="88" y="415">selected reads</text>
      <text x="504" y="382">Remember source</text><text x="504" y="415">provenance</text>
      <text x="920" y="382">Secrets, egress, and</text><text x="920" y="415">protected changes</text>
    </g>
    <text x="64" y="524" font-size="25" fill="#70c8db">Explainable decisions. Local audit log.</text>
    <text x="64" y="568" font-size="19" fill="#acc3d5">Defense in depth: keep native permissions and sandboxing.</text>
    <text x="1216" y="604" text-anchor="end" font-size="15" fill="#acc3d5">Independent open-source project. Not affiliated with Anthropic.</text>
  </g>
</svg>
