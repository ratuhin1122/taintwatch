name: "False positive"
description: "Report an unnecessary ask using sanitized evidence."
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, private tool contents or undisclosed vulnerabilities. Read SECURITY.md before reporting security issues. Redaction is best-effort; review all snippets manually."
  - type: textarea
    id: summary
    attributes:
      label: Summary and expected behavior
      description: Explain the use case and what should happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Taintwatch version/commit, Claude Code version, OS/architecture, plugin or standalone, relevant redacted policy.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal sanitized event sequence
      description: Include preceding taint source and requested action; use fake paths, domains and credentials.
    validations:
      required: true
  - type: input
    id: rule_id
    attributes:
      label: Rule ID from taintwatch explain
      placeholder: TW009
    validations:
      required: true
  - type: textarea
    id: audit
    attributes:
      label: Redacted audit snippet
      description: A minimal relevant record from the local audit log; replace personal paths, hosts and remaining secrets. Do not attach the full log or response body.
      render: json
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: I manually reviewed this report and removed private information and real credentials.
          required: true
