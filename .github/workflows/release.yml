name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: false
      - name: Validate tag, plugin versions and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release-metadata.py "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Test release helpers
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build, race tests and lint
        run: make build test lint VERSION=release-check
      - name: Gate corpus expectations
        run: ./build/taintwatch eval run --markdown
      - name: Lint shell entry points
        run: |
          shellcheck -s sh bin/taintwatch-launcher scripts/release-assets.sh
          shellcheck -s bash scripts/security-scan.sh

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Create the release and upload assets.
      id-token: write # Fulcio identity for keyless signing; no stored signing key.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: false
      - name: Install pinned Syft, verifying the pinned archive digest
        shell: bash
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/syft.tar.gz"
          printf '%s  %s\n' bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d "$RUNNER_TEMP/syft.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/release-tools"
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP/release-tools" syft
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
      - name: Install pinned Cosign, verifying the pinned binary digest
        shell: bash
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64 \
            -o "$RUNNER_TEMP/release-tools/cosign"
          printf '%s  %s\n' 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa "$RUNNER_TEMP/release-tools/cosign" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/release-tools/cosign"
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release-metadata.py "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Build release assets without publishing
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --skip=publish --release-notes=${{ runner.temp }}/release-notes.md
      - name: Sign checksums and verify the workflow identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
          cosign verify-blob \
            --certificate-identity "https://github.com/ratuhin1122/taintwatch/.github/workflows/release.yml@refs/tags/$RELEASE_TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      - name: Publish only verified release assets and changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python3 scripts/release-metadata.py --assets dist > "$RUNNER_TEMP/release-assets.txt"
          mapfile -t assets < "$RUNNER_TEMP/release-assets.txt"
          extra=()
          if [[ "$RELEASE_TAG" == *-* ]]; then extra+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --repo ratuhin1122/taintwatch --verify-tag \
            --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${extra[@]}" "${assets[@]}"
