name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.22.x', 'stable']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Check formatting, vet, race tests, and build
        run: make build test lint VERSION=ci
      - name: Check injected version
        run: test "$(./build/taintwatch version)" = ci
      - name: Test release helpers
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Gate corpus action expectations
        run: ./build/taintwatch eval run --markdown
      - name: Lint POSIX launcher
        if: runner.os == 'Linux'
        run: |
          shellcheck -s sh bin/taintwatch-launcher scripts/release-assets.sh
          shellcheck -s bash scripts/security-scan.sh

  security:
    # Advisory rollout: scanner findings/install failures are visible but do not
    # block CI. This job has no write token or OIDC permission.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: false
      - name: Install pinned govulncheck
        continue-on-error: true
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Install pinned gosec
        if: always()
        continue-on-error: true
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
      - name: Run govulncheck (advisory)
        if: always()
        continue-on-error: true
        run: bash scripts/security-scan.sh govulncheck
      - name: Run gosec (advisory)
        if: always()
        continue-on-error: true
        run: bash scripts/security-scan.sh gosec
