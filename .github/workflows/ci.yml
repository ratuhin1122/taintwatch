name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.22.x', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Check formatting, vet, race tests, and build
        run: make build test lint VERSION=ci
      - name: Check injected version
        run: test "$(./build/taintwatch version)" = ci
      - name: Gate corpus action expectations
        run: ./build/taintwatch eval run --markdown
      - name: Lint POSIX launcher
        if: runner.os == 'Linux'
        run: shellcheck -s sh bin/taintwatch-launcher scripts/release-assets.sh
